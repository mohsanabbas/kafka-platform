# Local stand-in for an MSK Standard cluster, plus the platform tools around it.
# Brokers are combined broker+controller nodes. MSK hides the controllers. The client view is the same.
# Host ports bind to 127.0.0.1: opsd, Kafka UI, and Cruise Control have no auth and can change the cluster.
name: kafka-platform

x-broker-env: &broker-env
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
  KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_OFFSETS_TOPIC_MIN_INSYNC_REPLICAS: 2
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_NUM_PARTITIONS: 6
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  # Must outlive the container: CLUSTER_ID is fixed, so a wiped log dir restarts partition leader
  # epochs at 0 and long-lived clients (Kafka UI, Cruise Control) reject the new metadata as stale.
  KAFKA_LOG_DIRS: /var/lib/kafka/data
  KAFKA_HEAP_OPTS: -Xms256M -Xmx512M
  KAFKA_METRIC_REPORTERS: com.linkedin.kafka.cruisecontrol.metricsreporter.CruiseControlMetricsReporter
  KAFKA_CRUISE_CONTROL_METRICS_TOPIC_AUTO_CREATE: "true"
  KAFKA_CRUISE_CONTROL_METRICS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_CRUISE_CONTROL_METRICS_TOPIC_NUM_PARTITIONS: 1
  KAFKA_CRUISE_CONTROL_METRICS_REPORTER_METRICS_REPORTING_INTERVAL_MS: 15000
  KAFKA_CRUISE_CONTROL_METRICS_REPORTER_BOOTSTRAP_SERVERS: kafka-1:19092,kafka-2:19092,kafka-3:19092

x-broker: &broker
  build:
    context: ./kafka
  image: kafka-platform-kafka:3.9.1
  restart: unless-stopped
  healthcheck:
    test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1 || exit 1"]
    interval: 10s
    timeout: 10s
    retries: 18
    start_period: 25s

x-after-brokers: &after-brokers
  kafka-1:
    condition: service_healthy
  kafka-2:
    condition: service_healthy
  kafka-3:
    condition: service_healthy

services:
  kafka-1:
    <<: *broker
    hostname: kafka-1
    container_name: kafka-1
    ports:
      - "127.0.0.1:19092:9092"
    volumes:
      - kafka-1-data:/var/lib/kafka/data
    environment:
      <<: *broker-env
      KAFKA_NODE_ID: 1
      KAFKA_BROKER_RACK: use1-az1
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:19092,PLAINTEXT_HOST://localhost:19092

  kafka-2:
    <<: *broker
    hostname: kafka-2
    container_name: kafka-2
    ports:
      - "127.0.0.1:19093:9092"
    volumes:
      - kafka-2-data:/var/lib/kafka/data
    environment:
      <<: *broker-env
      KAFKA_NODE_ID: 2
      KAFKA_BROKER_RACK: use1-az2
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:19092,PLAINTEXT_HOST://localhost:19093

  kafka-3:
    <<: *broker
    hostname: kafka-3
    container_name: kafka-3
    ports:
      - "127.0.0.1:19094:9092"
    volumes:
      - kafka-3-data:/var/lib/kafka/data
    environment:
      <<: *broker-env
      KAFKA_NODE_ID: 3
      KAFKA_BROKER_RACK: use1-az3
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:19092,PLAINTEXT_HOST://localhost:19094

  # Scale-out drill only: make add-broker
  kafka-4:
    <<: *broker
    profiles: ["add-broker"]
    hostname: kafka-4
    container_name: kafka-4
    ports:
      - "127.0.0.1:19095:9092"
    volumes:
      - kafka-4-data:/var/lib/kafka/data
    environment:
      <<: *broker-env
      KAFKA_NODE_ID: 4
      KAFKA_PROCESS_ROLES: broker
      KAFKA_BROKER_RACK: use1-az1
      KAFKA_LISTENERS: PLAINTEXT://:19092,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-4:19092,PLAINTEXT_HOST://localhost:19095

  topic-init:
    image: kafka-platform-kafka:3.9.1
    depends_on: *after-brokers
    volumes:
      - ./kafka/create-topics.sh:/create-topics.sh:ro
    entrypoint: ["/bin/bash", "/create-topics.sh"]
    restart: "no"

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.2.0
    container_name: kafka-ui
    depends_on: *after-brokers
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DYNAMIC_CONFIG_ENABLED: "true"
      KAFKA_CLUSTERS_0_NAME: lab
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:19092,kafka-2:19092,kafka-3:19092
    restart: unless-stopped

  cruise-control:
    build:
      context: ./cruise-control
    image: kafka-platform-cruise-control:2.5.146
    container_name: cruise-control
    depends_on:
      topic-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:9090:9090"
    environment:
      KAFKA_HEAP_OPTS: -Xms256M -Xmx512M
    volumes:
      - ./cruise-control/cruisecontrol.properties:/opt/cruise-control/config/cruisecontrol.properties:ro
      - ./cruise-control/capacity.json:/opt/cruise-control/config/capacity.json:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo >/dev/tcp/127.0.0.1/9090'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  # Free Cruise Control frontend (BSD). Its nginx serves the UI and proxies /kafkacruisecontrol/ on one origin.
  cruise-control-ui:
    image: devopsiaci/cruise-control-ui:0.4.0
    user: "0:0"
    container_name: cruise-control-ui
    depends_on:
      cruise-control:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:80"
    volumes:
      - ./cruise-control-ui/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./cruise-control-ui/config.csv:/usr/share/nginx/html/static/config.csv:ro
    restart: unless-stopped

  # Platform ops API: cluster health, consumer lag, audited offset resets, Cruise Control summaries.
  opsd:
    build:
      context: ..
      dockerfile: infra/opsd/Dockerfile
    image: kafka-platform-opsd:dev
    container_name: opsd
    depends_on:
      topic-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8090:8090"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka-1:19092,kafka-2:19092,kafka-3:19092
      CRUISE_CONTROL_URL: http://cruise-control:9090
      OPSD_ADDR: ":8090"
    restart: unless-stopped

# make reset deletes these.
volumes:
  kafka-1-data:
  kafka-2-data:
  kafka-3-data:
  kafka-4-data:
