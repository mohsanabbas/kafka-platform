# The UI and the Cruise Control API share one origin, so the browser never makes a CORS request.
# Cruise Control's CORS filter does not allow Content-Type, which broke every POST from the UI.

# Resolve cruise-control per request through Docker DNS. A static upstream pins the IP seen at
# startup, and a recreated cruise-control container usually gets a different one.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    set $cruise_control http://cruise-control:9090;

    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    location /kafkacruisecontrol/ {
        add_header Cache-Control "no-store" always;
        proxy_pass $cruise_control;
    }

    # Some UI pages (Peer Reviews) build URLs before loading config.csv when opened by deep link,
    # and request /review_board instead of /kafkacruisecontrol/review_board.
    location ~ ^/(?<endpoint>state|load|partition_load|proposals|user_tasks|kafka_cluster_state|review_board|review|rebalance|add_broker|remove_broker|demote_broker|fix_offline_replicas|stop_proposal_execution|pause_sampling|resume_sampling|bootstrap|train|topic_configuration|admin|rightsize|remove_disks|permissions)$ {
        add_header Cache-Control "no-store" always;
        proxy_pass $cruise_control/kafkacruisecontrol/$endpoint$is_args$args;
    }

    location /static/ {
        root /usr/share/nginx/html;
    }

    location / {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
