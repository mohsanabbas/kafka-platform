bootstrap.servers=kafka-1:19092,kafka-2:19092,kafka-3:19092

metric.sampler.class=com.linkedin.kafka.cruisecontrol.monitor.sampling.CruiseControlMetricsReporterSampler
metric.reporter.topic=__CruiseControlMetrics
sample.store.class=com.linkedin.kafka.cruisecontrol.monitor.sampling.KafkaSampleStore
partition.metric.sample.store.topic=__KafkaCruiseControlPartitionMetricSamples
broker.metric.sample.store.topic=__KafkaCruiseControlModelTrainingSamples
# Must exceed the broker default min.insync.replicas=2, or one broker down stops sample writes.
sample.store.topic.replication.factor=3

metadata.max.age.ms=10000
metric.sampling.interval.ms=15000
cruise.control.metrics.reporter.metrics.reporting.interval.ms=15000
partition.metrics.window.ms=60000
num.partition.metrics.windows=5
min.samples.per.partition.metrics.window=1
broker.metrics.window.ms=60000
num.broker.metrics.windows=5
min.samples.per.broker.metrics.window=1
min.valid.partition.ratio=0.5

capacity.config.file=/opt/cruise-control/config/capacity.json
sampling.allow.cpu.capacity.estimation=true

default.goals=com.linkedin.kafka.cruisecontrol.analyzer.goals.RackAwareGoal,com.linkedin.kafka.cruisecontrol.analyzer.goals.ReplicaCapacityGoal,com.linkedin.kafka.cruisecontrol.analyzer.goals.DiskCapacityGoal,com.linkedin.kafka.cruisecontrol.analyzer.goals.ReplicaDistributionGoal,com.linkedin.kafka.cruisecontrol.analyzer.goals.TopicReplicaDistributionGoal,com.linkedin.kafka.cruisecontrol.analyzer.goals.LeaderReplicaDistributionGoal
goals=com.linkedin.kafka.cruisecontrol.analyzer.goals.RackAwareGoal,com.linkedin.kafka.cruisecontrol.analyzer.goals.ReplicaCapacityGoal,com.linkedin.kafka.cruisecontrol.analyzer.goals.DiskCapacityGoal,com.linkedin.kafka.cruisecontrol.analyzer.goals.ReplicaDistributionGoal,com.linkedin.kafka.cruisecontrol.analyzer.goals.TopicReplicaDistributionGoal,com.linkedin.kafka.cruisecontrol.analyzer.goals.LeaderReplicaDistributionGoal,com.linkedin.kafka.cruisecontrol.analyzer.goals.PreferredLeaderElectionGoal
hard.goals=com.linkedin.kafka.cruisecontrol.analyzer.goals.RackAwareGoal,com.linkedin.kafka.cruisecontrol.analyzer.goals.ReplicaCapacityGoal,com.linkedin.kafka.cruisecontrol.analyzer.goals.DiskCapacityGoal

self.healing.enabled=false
two.step.verification.enabled=true

webserver.http.port=9090
webserver.http.address=0.0.0.0
# The UI reaches the API through its own nginx on the same origin. No CORS.
webserver.http.cors.enabled=false
webserver.api.urlprefix=/kafkacruisecontrol/*
webserver.ui.urlprefix=/*
